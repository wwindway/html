<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111312">
    <title>Portfolio — Full-screen Landing</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: #111312;
            color: #f4f3ed;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
        }

        .wrap {
            width: 100%;
        }

        .section {
            position: relative;
            display: flex;
            height: 100vh;
            height: 100svh;
            align-items: center;
            overflow: hidden;
            padding: 100px max(8vw, 28px);
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        .section::before {
            position: absolute;
            z-index: 0;
            width: min(58vw, 760px);
            aspect-ratio: 1;
            border: 1px solid rgb(244 243 237 / 10%);
            border-radius: 50%;
            content: "";
            pointer-events: none;
        }

        .section > * {
            position: relative;
            z-index: 1;
        }

        .intro {
            background: #111312;
        }

        .intro::before {
            top: 50%;
            right: -14vw;
            transform: translateY(-50%);
            box-shadow: 0 0 0 70px rgb(244 243 237 / 2%), 0 0 0 140px rgb(244 243 237 / 2%);
        }

        .profile {
            background: #d7ff64;
            color: #171a13;
        }

        .profile::before {
            right: 4vw;
            bottom: -34vw;
            border-color: rgb(23 26 19 / 16%);
            box-shadow: 0 0 0 70px rgb(23 26 19 / 4%), 0 0 0 140px rgb(23 26 19 / 4%);
        }

        .work {
            background: #202a3a;
        }

        .work::before {
            top: -28vw;
            right: -4vw;
            border-color: rgb(244 243 237 / 15%);
            box-shadow: 0 0 0 70px rgb(244 243 237 / 3%), 0 0 0 140px rgb(244 243 237 / 3%);
        }

        .content {
            width: min(100%, 1120px);
            margin: 0 auto;
        }

        .eyebrow {
            margin: 0 0 28px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .22em;
            text-transform: uppercase;
        }

        h1,
        h2,
        p {
            margin-top: 0;
        }

        h1,
        h2 {
            margin-bottom: 24px;
            font-size: clamp(56px, 11vw, 144px);
            font-weight: 700;
            letter-spacing: -.075em;
            line-height: .96;
        }

        h1 span {
            color: #d7ff64;
        }

        .profile h2 span {
            color: #637b26;
        }

        .description {
            max-width: 530px;
            margin-bottom: 0;
            font-size: clamp(16px, 2vw, 20px);
            line-height: 1.8;
            word-break: keep-all;
        }

        #work ul {
            display: grid;
            width: 100%;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: clamp(12px, 2vw, 24px);
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #work li {
            display: flex;
            min-width: 0;
            min-height: 200px;
            align-items: center;
            padding: clamp(18px, 3vw, 36px);
            border: 1px solid rgb(244 243 237 / 20%);
            background: rgb(244 243 237 / 4%);
        }

        #work li h2 {
            margin: 0;
            font-size: clamp(22px, 3vw, 40px);
            line-height: 1.2;
            word-break: keep-all;
        }

        .work-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            max-width: 760px;
            margin-top: 48px;
        }

        .work-item {
            min-height: 140px;
            padding: 24px;
            border: 1px solid rgb(244 243 237 / 20%);
            background: rgb(244 243 237 / 4%);
            backdrop-filter: blur(8px);
        }

        .work-item strong,
        .work-item span {
            display: block;
        }

        .work-item strong {
            margin-bottom: 12px;
            font-size: 20px;
        }

        .work-item span {
            color: rgb(244 243 237 / 66%);
            font-size: 14px;
        }

        .section-nav {
            position: fixed;
            z-index: 5;
            top: 50%;
            right: 28px;
            display: grid;
            gap: 12px;
            transform: translateY(-50%);
        }

        .section-nav a {
            width: 10px;
            height: 10px;
            border: 1px solid currentColor;
            border-radius: 50%;
            color: #f4f3ed;
            transition: background-color .25s ease, transform .25s ease;
        }

        .section-nav a[aria-current="true"] {
            background: currentColor;
            transform: scale(1.35);
        }

        .section-nav a:focus-visible {
            outline: 2px solid #d7ff64;
            outline-offset: 4px;
        }

        .scroll-cue {
            position: absolute;
            right: max(8vw, 28px);
            bottom: 36px;
            font-size: 11px;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .section .content > * {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 800ms ease-in, transform 800ms ease-in;
        }

        .section.is-active .content > * {
            opacity: 1;
            transform: translateY(0);
        }

        .section.is-active .content > :nth-child(2) {
            transition-delay: .12s;
        }

        .section.is-active .content > :nth-child(3) {
            transition-delay: .22s;
        }

        @media (max-width: 600px) {
            .section {
                padding: 50px 28px;
            }

            .section::before {
                width: 100vw;
            }

            #work ul {
                gap: 10px;
            }

            #work li {
                min-height: 145px;
                padding: 14px;
            }

            #work li h2 {
                font-size: clamp(18px, 5vw, 25px);
            }

            .work-list {
                grid-template-columns: 1fr;
                gap: 10px;
                margin-top: 18px;
            }

            .work-item {
                min-height: auto;
                padding: 12px;
            }

            .work-item strong {
                margin-bottom: 7px;
            }

            .section-nav {
                right: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            :root {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <nav class="section-nav" aria-label="섹션 이동">
        <a href="#intro" aria-label="인트로로 이동" aria-current="true"></a>
        <a href="#profile" aria-label="프로필로 이동"></a>
        <a href="#work" aria-label="작업으로 이동"></a>
    </nav>

    <main class="wrap">
        <section class="section intro is-active" id="intro" aria-labelledby="intro-title">
            <div class="content">
                <p class="eyebrow">Portfolio · 2026</p>
                <h1 id="intro-title"></h1>                
            </div>            
        </section>

        <section class="section profile" id="profile" aria-labelledby="profile-title">
            <div class="content">
                <p class="eyebrow">01 · Profile</p>
                <h2 id="profile-title"></span></h2>            
            </div>       
        </section>

        <section class="section work" id="work" aria-labelledby="work-title">
            <ul>
                <li>
                    <h2>상세페이지</h2>
                </li>
                <li>
                    <h2>디자인 리뉴얼</h2>
                </li>
                <li>
                    <h2>프리미어 편집작업</h2>
                </li>
                <li>
                    <h2>애프터 이펙트 모션작업</h2>
                </li>
            </ul>            
        </section>
    </main>

    <script>
        const sections = document.querySelectorAll(".section");
        const sectionLinks = document.querySelectorAll(".section-nav a");

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (!entry.isIntersecting) return;

                entry.target.classList.add("is-active");
                sectionLinks.forEach((link) => {
                    const isCurrent = link.getAttribute("href") === `#${entry.target.id}`;
                    if (isCurrent) {
                        link.setAttribute("aria-current", "true");
                    } else {
                        link.removeAttribute("aria-current");
                    }
                });
            });
        }, { threshold: 0.6 });

        sections.forEach((section) => observer.observe(section));
    </script>
</body>
</html>
